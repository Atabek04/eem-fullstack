services:
  app:
    image: eem-app:0.0.1-SNAPSHOT
    container_name: eem-app
    depends_on:
      - postgres
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=eem_db
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - JWT_SECRET=U2FsdGVkX19osuGIYdp95E1jk3P+U++wyKTxHLUQ4c0=
    ports:
      - "8080:8080"
    networks:
      - eem-network


  postgres:
    image: postgres:15-alpine
    container_name: eem-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=eem_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - eem-network
    restart: unless-stopped

networks:
  eem-network:
    driver: bridge

volumes:
  postgres-data: